name: Ladybird Android arm64 (build + release)

# Builds an arm64-v8a release APK of Ladybird from the upstream source tree,
# signs it, and publishes it as a GitHub Release in this repository.
#
# Triggers:
#   - every push to this repository
#   - every 7 days (cron), picking up the latest upstream Ladybird master
#   - manually from the Actions tab
#
# NOTE: Ladybird is a large native C++ project. The native build is done with
# the same toolchain its own CI uses (macOS 14, Xcode, NDK r29, vcpkg, Rust).
# The first run is slow; later runs are sped up by the ccache/vcpkg caches.

on:
  push:
  schedule:
    # 03:00 UTC on the 1st, 8th, 15th, 22nd and 29th of every month.
    - cron: '0 3 */7 * *'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Override the release version name (otherwise auto-generated)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ladybird-arm64-release
  cancel-in-progress: true

env:
  LADYBIRD_SOURCE_DIR: ${{ github.workspace }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: 2G
  SCCACHE_IDLE_TIMEOUT: 0
  VCPKG_ROOT: ${{ github.workspace }}/Build/vcpkg
  LADYBIRD_CACHE_DIR: ${{ github.workspace }}/Build/caches
  GRADLE_OPTS: '-Xmx3072m'
  UPSTREAM_REPO: LadybirdBrowser/ladybird

jobs:
  build-and-release:
    name: Build and publish arm64 APK
    runs-on: macos-14
    timeout-minutes: 360

    steps:
      - name: Check out upstream Ladybird source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: master
          fetch-depth: 1

      - name: Record build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "UPSTREAM_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "UPSTREAM_URL=https://github.com/${UPSTREAM_REPO}/commit/$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          BASE_VERSION="1.0.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          VERSION_NAME="${{ inputs.version_name }}"
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="$BASE_VERSION"; fi
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "APK_NAME=Ladybird-arm64-${VERSION_NAME}.apk" >> "$GITHUB_ENV"

      - name: Prepare git safe directory
        shell: bash
        run: |
          echo "GIT_CONFIG_GLOBAL=${RUNNER_TEMP}/gitconfig" >> "$GITHUB_ENV"
          git config --file "${RUNNER_TEMP}/gitconfig" --add safe.directory "${GITHUB_WORKSPACE}"

      # ---- Toolchain (mirrors Ladybird's own CI setup action) ----

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create Ladybird Python environment
        shell: bash
        run: |
          set -euo pipefail
          python_bin=$(python3 Meta/Utils/python_environment.py --print-bin | tr -d '\r')
          echo "${python_bin}" >> "$GITHUB_PATH"
          echo "pythonLocation=$(dirname "${python_bin}")" >> "$GITHUB_ENV"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27'

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew unlink openssl@3 || true
          brew install autoconf autoconf-archive automake bash ccache coreutils \
                       libtool llvm@22 nasm ninja pkg-config sccache unzip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Warm Rust toolchain
        shell: bash
        run: rustup toolchain install && cargo --version && rustc --version

      - name: Install wasm-tools
        shell: bash
        run: |
          set -euo pipefail
          VERSION=1.243.0
          FILENAME="wasm-tools-${VERSION}-aarch64-macos.tar.gz"
          URL="https://github.com/bytecodealliance/wasm-tools/releases/download/v${VERSION}/${FILENAME}"
          for attempt in 1 2 3 4; do
            if curl --fail --location --output "${FILENAME}" "${URL}"; then break; fi
            if [ "$attempt" -eq 4 ]; then echo "wasm-tools download failed" >&2; exit 1; fi
            sleep $((attempt * 15))
          done
          tar -xzf "${FILENAME}"
          rm "${FILENAME}"
          mv "wasm-tools-${VERSION}-aarch64-macos" wasm-tools
          echo "${GITHUB_WORKSPACE}/wasm-tools" >> "$GITHUB_PATH"

      - name: Fetch cargo dependencies
        shell: bash
        run: |
          set -euo pipefail
          for manifest in Cargo.toml Libraries/LibJS/Flap/Cargo.toml; do
            if [ -f "${manifest}" ]; then
              cargo fetch --locked --manifest-path "${manifest}"
            fi
          done

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # ---- Caches (so the weekly rebuilds stay fast) ----

      - name: Restore build caches
        uses: actions/cache/restore@v6
        id: ccache
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache|Android|arm64|Clang|Release|${{ github.run_id }}
          restore-keys: ccache|Android|arm64|Clang|Release|

      - name: Configure ccache
        shell: bash
        run: |
          ccache -M 0
          find "${CCACHE_DIR}" 2>/dev/null | tac | xargs touch -a -m -d "2018-10-10T09:53:07Z" 2>/dev/null || true
          ccache -s
          ccache -z

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v6
        id: vcpkg
        with:
          path: ${{ github.workspace }}/Build/caches/vcpkg-binary-cache
          key: vcpkg|Android|arm64|Clang|Release|${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg|Android|arm64|Clang|Release|

      - name: Install vcpkg dependencies
        shell: bash
        run: ./Meta/ladybird.py vcpkg --preset Release

      - name: Install Android SDK / NDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses > /dev/null 2>&1 || true
          "${SDKMANAGER}" "platform-tools" "build-tools;35.0.0" "platforms;android-35" "ndk;29.0.13599879"

      # ---- Build the APK ----

      - name: Configure APK for arm64 and set version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          path = "UI/Android/build.gradle.kts"
          text = open(path).read()
          text = re.sub(r"versionCode\s*=\s*\d+", f'versionCode = {os.environ["VERSION_CODE"]}', text)
          text = re.sub(r'versionName\s*=\s*"[^"]*"', f'versionName = "{os.environ["VERSION_NAME"]}"', text)
          text = re.sub(r"abiFilters\s*\+=\s*listOf\([^)]*\)", 'abiFilters += listOf("arm64-v8a")', text)
          open(path, "w").write(text)
          print(text)
          PY

      - name: Build arm64-v8a release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x UI/Android/gradlew
          cd UI/Android
          ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Locate and sign the APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED=$(find UI/Android/build/outputs/apk -type f -name '*.apk' | head -n 1)
          if [ -z "${UNSIGNED}" ]; then
            echo "No APK produced by Gradle" >&2
            find UI/Android/build/outputs -type f | head -n 50 >&2 || true
            exit 1
          fi
          echo "Unsigned APK: ${UNSIGNED}"

          if [ -z "${SIGNING_KEYSTORE_B64}" ] || [ -z "${SIGNING_STORE_PASSWORD}" ] || \
             [ -z "${SIGNING_KEY_ALIAS}" ] || [ -z "${SIGNING_KEY_PASSWORD}" ]; then
            echo "Signing secrets are not configured" >&2
            exit 1
          fi
          printf '%s' "${SIGNING_KEYSTORE_B64}" | base64 --decode > /tmp/ladybird-release.jks
          trap 'rm -f /tmp/ladybird-release.jks' EXIT

          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "${APKSIGNER}" ]; then
            echo "apksigner not found under ${ANDROID_HOME}/build-tools" >&2
            exit 1
          fi

          "${APKSIGNER}" sign \
            --ks /tmp/ladybird-release.jks \
            --ks-type PKCS12 \
            --ks-key-alias "${SIGNING_KEY_ALIAS}" \
            --ks-pass "pass:${SIGNING_STORE_PASSWORD}" \
            --key-pass "pass:${SIGNING_KEY_PASSWORD}" \
            --out "${APK_NAME}" \
            "${UNSIGNED}"
          "${APKSIGNER}" verify --verbose "${APK_NAME}"
          ls -lh "${APK_NAME}"

      - name: Save build caches
        if: success()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Save vcpkg binary cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/Build/caches/vcpkg-binary-cache
          key: ${{ steps.vcpkg.outputs.cache-primary-key }}

      # ---- Publish ----

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Ladybird Android arm64 — ${{ env.VERSION_NAME }}
          body: |
            Unofficial automated arm64-v8a build of Ladybird for Android.

            - Version: `${{ env.VERSION_NAME }}`
            - Upstream source: LadybirdBrowser/ladybird@`${{ env.UPSTREAM_SHA }}`
            - Built by GitHub Actions from the upstream `master` branch.

            This is a pre-alpha browser; expect bugs and incomplete web compatibility.
          files: ${{ env.APK_NAME }}
          generate_release_notes: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
